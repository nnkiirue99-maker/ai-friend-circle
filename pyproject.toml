[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-friend-circle"
version = "0.3.0"
description = "Isolated the host app federation transport; no production app imports"
requires-python = ">=3.11"
dependencies = [
  "flask>=3.1.2,<4",
  "cryptography>=46,<49",
  "http-message-signatures==3.0.0",
  "requests>=2.32.5,<3",
  "urllib3>=2.5,<3",
  "pillow>=13,<14",
]

[dependency-groups]
dev = ["pytest>=8.4,<10", "ruff>=0.14", "trustme>=1.2,<2"]

[project.scripts]
friend-circle = "friend_circle.cli:main"

[project.optional-dependencies]
deploy = [
    "gunicorn>=23,<26",
]

[tool.hatch.build.targets.wheel]
packages = ["src/friend_circle"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
